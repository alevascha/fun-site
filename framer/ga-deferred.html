<!-- Google Analytics, deferred (Framer → Custom Code → End of <body>, all pages).
     Replaces Framer's built-in GA integration (Site Settings), which loads
     gtag.js (~176 KB) while the page is still loading. This loads it 8 s after
     the page has finished loading (when the browser is idle), or right away on
     the first tap, wheel or key press. The page view waits in dataLayer and is
     sent as soon as gtag.js arrives. Trade-off chosen on 2026-10-16: visits
     that leave within ~8 s without touching anything aren't counted; in
     return gtag's ~200 ms of long tasks stay out of the page's load (about
     +3-5 mobile PageSpeed points on the home). Not on "scroll": Lenis
     and the motion layer fire scroll events while the page boots, which
     loaded gtag.js before the largest paint; and only trusted (real) input,
     since Framer dispatches a synthetic pointerdown while it boots. Page views on Framer's
     client-side navigation are tracked by GA4's enhanced measurement
     ("Page changes based on browser history events", on by default). -->
<script>
(function () {
  var ID = 'G-VFR39PY4NF';
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', ID);
  var loaded = false;
  function load() {
    if (loaded) return;
    loaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
    document.head.appendChild(s);
  }
  function idle() { 'requestIdleCallback' in window ? requestIdleCallback(load, { timeout: 4000 }) : setTimeout(load, 2500); }
  function afterLoad() { setTimeout(idle, 8000); }
  if (document.readyState === 'complete') afterLoad(); else addEventListener('load', afterLoad, { once: true });
  // Only real input counts: Framer's own script dispatches a synthetic
  // pointerdown while it boots (isTrusted is false for those).
  var INPUTS = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
  function onInput(e) { if (!e.isTrusted) return; INPUTS.forEach(function (t) { removeEventListener(t, onInput, true); }); load(); }
  INPUTS.forEach(function (t) { addEventListener(t, onInput, { capture: true, passive: true }); });
})();
</script>
