[build]
  command = "npm run build"
  publish = "dist"

# Every real route is prerendered as <route>.html, which Netlify serves first.
# Anything else is a genuine 404: serve the app shell with a 404 status so
# search engines don't index typos as duplicate pages.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
